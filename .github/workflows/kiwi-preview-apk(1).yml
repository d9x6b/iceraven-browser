# Kiwi-inspired Iceraven debug APK build. Not an official Iceraven or Kiwi release.
# This includes the source patch explicitly, so only ONE file needs to be uploaded.
name: Iceraven Kiwi Edition – Preview APK

on:
  push:
    branches:
      - iceraven
      - kiwi-preview-2026
    paths:
      - .github/workflows/kiwi-preview-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Iceraven with Android Components submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Kiwi-inspired settings patch (embedded below)
