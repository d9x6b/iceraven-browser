          +# Prüfbericht: Iceraven → Kiwi-inspirierte Edition
          +
          +**Basis:** vom Nutzer hochgeladenes `iceraven-browser-iceraven.zip` (4.137 Dateien; Quellpaket des Firefox-/GeckoView-Forks Iceraven). Die Änderungen beziehen sich auf diesen konkreten Versionsstand. Dieser Bericht ist kein Sicherheitszertifikat.
          +
          +## Befunde im Bestand
          +
          +1. **Einstellungen:** `app/src/main/res/xml/customization_preferences.xml` ist die tatsächliche Anpassen-Seite. Der frühere externe Werkzeugentwurf zielte fälschlich auf die allgemeine `preferences.xml` und wäre daher nicht korrekt angezeigt worden. Im vorliegenden Quellstand ist der neue Block an der richtigen Stelle angebunden.
          +2. **Unnötiges Logging:** `SharedPreferenceUpdater.kt` schrieb neue String-Einstellungswerte in Logs, darunter Werte der benutzerdefinierten Add-on-Sammlung. Dies wurde entfernt.
          +3. **Doppelte Arbeit:** Zwei Zugriffe auf `Settings(requireContext())` in `CustomizationFragment.kt` erzeugten jeweils ein neues Settings-Objekt, obwohl `requireComponents.settings` bereits existiert. Die beiden Aufrufe wurden umgestellt.
          +4. **Unnötige Cache-Invalidierung:** Die Add-on-Cache-Leerung erfolgte bei `SharedPreferenceUpdater` auch bei einer unveränderten String-Auswahl. Sie wird nun nur nach echtem Wertwechsel aufgerufen.
          +5. **Nicht entfernen:** Das `android:usesCleartextTraffic="true"` aus `AndroidManifest.xml` und die Basiskonfiguration in `network_security_config.xml` sind für allgemeine HTTP-Webseiten potenziell beabsichtigt. Ohne Ende-zu-Ende-Test darf ein Browser diese Fähigkeit nicht blind verlieren.
          +6. **Nicht entfernen:** `FLAG_SECURE`-Logik im Privatmodus wird in mehreren Dateien verwendet. Keine pauschale Vereinfachung, da sie Privatsphäre oder Screenshot-Verhalten verschlechtern könnte.
          +7. **Build-Lücke:** Der ZIP-Export enthält keinen Git-Submodul-Commit für `android-components` (leeres Verzeichnis), obwohl `.gitmodules` und `settings.gradle` darauf verweisen. Ein Git-Fork mit rekursivem Checkout ist erforderlich.
          +
          +## Umsetzung
          +
          +- Drei funktionale zusätzliche Darstellungsoptionen, Standardwerte greifen nicht in vorhandene Fensterpolitik ein.
          +- 2 neue lokalisierte Ressourcen-XML-Dateien, 1 Controller und 1 Kotlin-JUnit-Testdatei.
          +- Anbindung an XML-Präferenzen, App-SharedPreferences und `HomeActivity` mit Aktivierung beim Wiederaufnehmen und Freigabe beim Pausieren.
          +- Vollständiger Originalquellcode bleibt im bearbeiteten ZIP erhalten.
          +- Separater Git-Patch gegen das hochgeladene Originalarchiv und manueller CI-Workflow für ein Debug-APK.
          +
          +## Tatsächlich ausgeführte Prüfungen
          +
          +| Prüfung | Ergebnis |
          +|---|---|
          +| 517 App-Ressourcen-XML-Dateien geparst | 0 Parsefehler |
          +| Neue XML-Präferenzschlüssel und Laufzeitbindung geprüft | 3/3 vorhanden |
          +| Deutsch/Englisch und identische technische Listenwerte | bestanden |
          +| Kotlin-Controller mit Android-Stubs per `kotlinc` kompiliert | bestanden |
          +| Kotlin-Controller-Test (15 Assertions) | bestanden |
          +| Git-Patch gegen frisch extrahiertes Original angewandt | bestanden |
          +| Patch nach Anwenden erneut statisch geprüft | bestanden |
          +| Vollständiger Gradle-/Android-Build | **nicht ausgeführt** (Android-Submodul/SDK/Gradle-Verteilung fehlen; kein Netzwerkzugriff) |
          +| Gerätetest / tatsächliche APK | **nicht ausgeführt** |
          +
          +## Einschränkungen und nächster Prüfschritt
          +
          +Die Analysen betreffen hauptsächlich die geänderten Bereiche. Ein vollständiger manueller Sicherheits- und Laufzeit-Audit aller Kotlin-, Java-, XML-, Build- und Abhängigkeitsdateien ist **nicht** erfolgt. Die übrigen Quellen wurden nicht pauschal als fehlerfrei bewertet; vermeintlich ungenutzte Ressourcen wurden nicht ohne Beweis gelöscht.
          +
          +Die nächsten harten Prüfungen sind `./gradlew app:assembleForkDebug`, relevante JUnit-Tests und ein manueller Test auf einem Android-Gerät mit wechselnder Ausrichtung, Videowiedergabe, Privatmodus, Hintergrundwechsel und Erweiterungen.
