          @@ -0,0 +1,13 @@
          +package android.app
          +
          +open class Activity {
          +    val window = Window()
          +    var requestedOrientation: Int = -1
          +}
          +class Window {
          +    var attributes = WindowAttributes()
          +    var flags: Int = 0
          +    fun addFlags(flag: Int) { flags = flags or flag }
          +    fun clearFlags(flag: Int) { flags = flags and flag.inv() }
          +}
          +class WindowAttributes { var screenBrightness: Float = -1f }
