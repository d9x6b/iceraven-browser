# Manual CI trigger
name: Full source test repair validation

on:
  push:
    branches: [dev/test-suite-repair]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.ref == 'refs/heads/dev/test-suite-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodule
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: 'true'
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare SDK and upstream build inputs
        shell: bash
        run: |
          bash -e -o pipefail automation/iceraven/install-sdk.sh
          bash -e -o pipefail automation/iceraven/patch_android_components.sh
          bash -e -o pipefail automation/iceraven/setup_venv.sh
          git submodule status
          free -h

      - name: Prepare isolated test identity and upstream branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          start = s.index('        forkRelease releaseTemplate >> {')
          end = s.index('        benchmark releaseTemplate >> {', start)
          block = s[start:end]
          replacements = {
              'applicationIdSuffix ".iceraven"': 'applicationIdSuffix ".iceraven.baseline"',
              'def deepLinkSchemeValue = "iceraven"': 'def deepLinkSchemeValue = "iceraven-baseline"',
              '"io.github.forkmaintainers.iceraven.sharedID"': '"io.github.forkmaintainers.iceraven.baseline.sharedID"',
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              block = block.replace(old, new)
          p.write_text(s[:start] + block + s[end:])
          PY
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Compile full unit-test sources and run ten selected test classes
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"'
        run: |
          mkdir -p consent-diagnostics
          ./gradlew :app:tasks --all --console=plain --no-daemon | tee consent-diagnostics/gradle-tasks.txt
          # Use a real task advertised by this revision, rather than assuming
          # custom build types have a corresponding unit-test task.
          task="$(python - <<'PY'
          import re
          from pathlib import Path
          tasks = set(re.findall(r'^\s*(?:app:)?(test\w+(?:UnitTest|HostTest))(?=\s|$)', Path('consent-diagnostics/gradle-tasks.txt').read_text(), re.M))
          for candidate in ('testForkDebugUnitTest', 'testForkDebugHostTest', 'testDebugUnitTest', 'testDebugHostTest', 'testForkReleaseUnitTest', 'testForkReleaseHostTest'):
              if candidate in tasks:
                  print(candidate)
                  break
          else:
              raise SystemExit(f'No supported Fenix unit-test task found. Available: {sorted(tasks)}')
          PY
          )"
          echo "Selected Gradle test task: :app:$task"
          printf '%s\n' "$task" > consent-diagnostics/selected-task.txt
          # Compile the entire unit-test source set, then execute the ten selected classes.
          ./gradlew ":app:$task" --tests 'org.mozilla.fenix.dataChoicesStore.DataChoicesMiddlewareTest' --tests 'org.mozilla.fenix.onboarding.store.DefaultPrivacyPreferencesRepositoryTest' --tests 'org.mozilla.fenix.components.PlayStoreReviewPromptControllerTest' --tests 'org.mozilla.fenix.components.metrics.AdjustMetricsServiceTest' --tests 'org.mozilla.fenix.components.metrics.InstallReferrerWorkerTest' --tests 'org.mozilla.fenix.components.metrics.MetricControllerTest' --tests 'org.mozilla.fenix.components.metrics.MetricsUtilsTest' --tests 'org.mozilla.fenix.ipprotection.store.IPProtectionOnboardingPromptTest' --tests 'org.mozilla.fenix.pbmlock.PrivateBrowsingLockFeatureTest' --tests 'org.mozilla.fenix.settings.HomeSettingsFragmentTest' --stacktrace --no-daemon
          # Do not treat a successful Gradle invocation with no executed tests as a pass.
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'org.mozilla.fenix.dataChoicesStore.DataChoicesMiddlewareTest',
              'org.mozilla.fenix.onboarding.store.DefaultPrivacyPreferencesRepositoryTest',
              'org.mozilla.fenix.components.PlayStoreReviewPromptControllerTest',
              'org.mozilla.fenix.components.metrics.AdjustMetricsServiceTest',
              'org.mozilla.fenix.components.metrics.InstallReferrerWorkerTest',
              'org.mozilla.fenix.components.metrics.MetricControllerTest',
              'org.mozilla.fenix.components.metrics.MetricsUtilsTest',
              'org.mozilla.fenix.ipprotection.store.IPProtectionOnboardingPromptTest',
              'org.mozilla.fenix.pbmlock.PrivateBrowsingLockFeatureTest',
              'org.mozilla.fenix.settings.HomeSettingsFragmentTest',
          }
          executed = set()
          task = Path('consent-diagnostics/selected-task.txt').read_text().strip()
          for root in (Path('gradle/build/app/test-results'), Path('app/build/test-results')):
              for report in (root / task).rglob('TEST-*.xml'):
                  for case in ET.parse(report).iter('testcase'):
                      if case.find('skipped') is None:
                          executed.add(case.get('classname'))
          if not expected <= executed:
              raise SystemExit(f'Missing executed selected test classes: {sorted(expected - executed)}')
          print('Verified execution of all ten selected test classes.')
          PY

      - name: Upload test repair reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-repair-tests-${{ github.run_id }}
          path: |
            consent-diagnostics/
            gradle/build/app/test-results/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
