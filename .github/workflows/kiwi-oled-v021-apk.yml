          @@ -0,0 +1,115 @@
          +#!/usr/bin/env python3
          +"""Conservative static audit for the Kiwi display extension in an Iceraven source tree.
          +
          +This is not an Android/Kotlin/Gradle compile and is not a security audit.
          +"""
          +from __future__ import annotations
          +import json
          +import sys
          +from pathlib import Path
          +import xml.etree.ElementTree as ET
          +
          +ROOT = Path(__file__).resolve().parents[1]
          +PREFS = ROOT / 'app/src/main/res/xml/customization_preferences.xml'
          +EN = ROOT / 'app/src/main/res/values/kiwi_display.xml'
          +DE = ROOT / 'app/src/main/res/values-de/kiwi_display.xml'
          +CTRL = ROOT / 'app/src/main/java/org/mozilla/fenix/settings/KiwiDisplayController.kt'
          +UI = ROOT / 'app/src/main/java/org/mozilla/fenix/settings/CustomizationFragment.kt'
          +HOME = ROOT / 'app/src/main/java/org/mozilla/fenix/HomeActivity.kt'
          +UPDATER = ROOT / 'app/src/main/java/org/mozilla/fenix/settings/SharedPreferenceUpdater.kt'
          +PREFIX = '{http://schemas.android.com/apk/res/android}'
          +
          +
          +def collect_resources(path: Path) -> dict[str, tuple[str, ...]]:
          +    res = {}
          +    for item in ET.parse(path).getroot():
          +        name = item.get('name')
          +        if name in res:
          +            raise AssertionError(f'duplicate {name!r} in {path}')
          +        res[name] = (item.tag, *[x.text or '' for x in item.findall('item')])
          +    return res
          +
          +
          +def audit():
          +    problems = []
          +    source = CTRL.read_text()
          +    ui = UI.read_text()
          +    home = HOME.read_text()
          +    en = collect_resources(EN)
          +    de = collect_resources(DE)
          +    prefs = ET.parse(PREFS)
          +    controls = {}
          +    for item in prefs.iter():
          +        key = item.get(PREFIX + 'key')
          +        if key and key.startswith('kiwi_'):
          +            if key in controls:
          +                problems.append(f'duplicate preference key: {key}')
          +            controls[key] = item
          +    expected_bindings = {
          +        'kiwi_display_keep_awake': 'KEEP_AWAKE_KEY',
          +        'kiwi_display_orientation': 'ORIENTATION_KEY',
          +        'kiwi_display_brightness': 'BRIGHTNESS_KEY',
          +    }
          +    expected = set(expected_bindings)
          +    if expected - set(controls):
          +        problems.append('missing control keys: ' + str(sorted(expected - set(controls))))
          +    if set(en) != set(de):
          +        problems.append('German/English resource keys differ')
          +    for name, (tag, *values) in en.items():
          +        if de.get(name, (None,))[0] != tag:
          +            problems.append('Resource type differs: ' + name)
          +        if tag == 'string-array' and len(de[name]) != len(en[name]):
          +            problems.append('Resource array length differs: ' + name)
          +    for value_key in ('kiwi_orientation_values', 'kiwi_brightness_values'):
          +        if de[value_key] != en[value_key]:
          +            problems.append('Localized machine values must remain identical: ' + value_key)
          +    for item in controls.values():
          +        for attr in ('title','summary','entries','entryValues'):
          +            value = item.get(PREFIX + attr)
          +            if value and value.startswith('@') and value[1:].split('/')[1] not in en:
          +                problems.append(f'Unresolved Kiwi string/array resource: {value}')
          +    for key, binding in expected_bindings.items():
          +        if f'"{key}"' not in source:
          +            problems.append(f'{key}: missing controller constant')
          +        if f'KiwiDisplayController.{binding}' not in ui:
          +            problems.append(f'{key}: missing UI preference binding')
          +    if ui.count('applyKiwiDisplayControls()') < 3:
          +        problems.append('expected all three preferences to apply immediately')
          +    for entry_key, value_key in (
          +        ('kiwi_orientation_entries', 'kiwi_orientation_values'),
          +        ('kiwi_brightness_entries', 'kiwi_brightness_values'),
          +    ):
          +        if len(en[entry_key]) != len(en[value_key]):
          +            problems.append(f'{entry_key} has a different number of labels and values')
          +    if 'setupKiwiDisplayControls()' not in ui or 'applyKiwiDisplayControls()' not in home:
          +        problems.append('new controls are not linked to app runtime')
          +    if 'kiwiDisplayController.release()' not in home:
          +        problems.append('window flag cleanup missing')
          +    if 'Logger(' in UPDATER.read_text():
          +        problems.append('preference updater still logs value through Logger')
          +    if (ROOT / 'android-components').is_dir() and any((ROOT / 'android-components').iterdir()):
          +        ac = 'present'
          +    else:
          +        ac = 'absent (Git submodule not included by GitHub ZIP)'
          +    # Try parsing resource XML; count errors but do not mutate or remove unsupported files.
          +    broken = []
          +    xmls = list((ROOT / 'app/src/main/res').rglob('*.xml'))
          +    for file in xmls:
          +        try:
          +            ET.parse(file)
          +        except ET.ParseError as e:
          +            broken.append(f'{file.relative_to(ROOT)}: {e}')
          +    problems.extend(broken[:10])
          +    report = {
          +        'checked_xml_files': len(xmls),
          +        'new_preference_keys': sorted(expected),
          +        'locale_resource_keys': len(en),
          +        'android_components_submodule': ac,
          +        'errors': problems,
          +        'limitations': 'Static XML and source integration checks only; not Kotlin/Gradle compilation',
          +    }
          +    print(json.dumps(report, ensure_ascii=False, indent=2))
          +    return 1 if problems else 0
          +
          +if __name__ == '__main__':
          +    sys.exit(audit())
