          +#!/usr/bin/env bash
          +set -euo pipefail
          +cd "$(dirname "$0")/../.."
          +tmpdir="$(mktemp -d)"
          +trap 'rm -rf "$tmpdir"' EXIT
          +kotlinc \
          +  kiwi-tools/tests/StubAndroid.kt \
          +  kiwi-tools/tests/StubAndroidInfo.kt \
