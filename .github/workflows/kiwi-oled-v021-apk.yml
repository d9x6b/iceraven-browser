      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: ./automation/iceraven/install-sdk.sh

      - name: Prepare Android Components and Python
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Apply original Iceraven string-resource fixes
        run: |
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Static audit of customized settings and resources
        run: python3 kiwi-tools/audit.py

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build arm64 and other debug APK variants
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g"
        run: ./gradlew app:assembleForkDebug --stacktrace --no-daemon

      - name: Collect APK output
        run: |
          mkdir -p preview-apks
          find . -path '*/outputs/apk/*' -type f -name '*forkDebug*.apk' -exec cp -v {} preview-apks/ \;
          find preview-apks -type f -name '*.apk' | grep -q .
          ls -alh preview-apks/

      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: Iceraven-Kiwi-OLED-v021-APK
          path: preview-apks/*.apk
          retention-days: 14
          if-no-files-found: error
