          @@ -0,0 +1,69 @@
          +# Iceraven mit Kiwi-inspirierten Anzeigeoptionen – Quellprojekt
          +
          +**Status:** Editierter Iceraven-Quellcode, **kein getesteter Android-Build, keine fertige APK**.
          +
          +Die ZIP in diesem Projekt stammt aus dem vom Nutzer bereitgestellten Iceraven-Archiv (Zweig `iceraven`, Export vom November 2026). Die Firefox-/GeckoView-Architektur wurde bewusst nicht ausgetauscht. Dies ist weder Kiwi Browser noch ein offizielles Iceraven-Release. Chrome-Web-Store-Erweiterungen werden damit **nicht** unterstützt.
          +
          +## Umsetzung
          +
          +Unter **Einstellungen → Anpassen → Erweiterte Anzeigeoptionen** gibt es:
          +
          +1. **Bildschirm eingeschaltet lassen**: setzt Android `FLAG_KEEP_SCREEN_ON` nur im aktiven App-Fenster. Im Hintergrund wird das Flag wieder freigegeben.
          +2. **Bildschirmausrichtung**: Systemeinstellung / Hochformat / Querformat. Standardmäßig greift der Fork nicht in Iceravens bisherige Ausrichtungssteuerung ein. Android kann das Erzwingen der Ausrichtung bei bestimmten Gerätekategorien ignorieren.
          +3. **Helligkeit im Browser**: Systemeinstellung / 25 % / 50 % / 75 % / 100 %. Der ursprüngliche Wert des Fensters wird bei Rückkehr zur Systemeinstellung oder Verlassen des Fensters wiederhergestellt; die globale Gerätehelligkeit wird **nicht** geändert.
          +
          +Neue Einstellungen werden im bestehenden `fenix_preferences`-Store gespeichert und unmittelbar angewandt. Bei Standardwerten werden die vorherigen Window-Flags nicht pauschal gelöscht. Verfügbar in Deutsch und Englisch, andere Sprachen erhalten die englischen Texte.
          +
          +## Konkrete Codepflege
          +
          +- `SharedPreferenceUpdater.kt`: entfernt unnötige Logs von String-Einstellungswerten; das Add-on-Cache wird nicht mehr geleert, wenn derselbe Wert erneut ausgewählt wird.
          +- `CustomizationFragment.kt`: zweimaliges Erzeugen eines neuen `Settings`-Objekts durch Wiederverwendung der bestehenden `requireComponents.settings`-Instanz ersetzt.
          +- Die bisherigen Funktionen (Erweiterungen, Tabs, private Fenster, Passwortspeicher, Site Permissions, Trackingschutz) wurden **nicht** entfernt. Bei dynamisch geladenen Ressourcen wäre blindes Löschen riskant.
          +
          +## Tests
          +
          +In einem Python-Umfeld:
          +
          +```bash
          +python3 kiwi-tools/audit.py
          +```
          +
          +Mit installiertem Kotlin-Compiler (`kotlinc`) und Java:
          +
          +```bash
          +bash kiwi-tools/tests/run_controller_smoke.sh
          +```
          +
          +Diese Tests prüfen XML, Einstellungs-Verdrahtung und den Controller mit Android-Testdoubles. Sie ersetzen **keinen Android-Build** oder einen Gerätetest.
          +
          +## APK aus dem GitHub-Fork erstellen (empfohlener Weg)
          +
          +1. Auf GitHub ein eigenes Fork von `fork-maintainers/iceraven-browser` anlegen. Das ist wichtig, um den **gepinnten Git-Submodul-Verweis für `android-components`** zu behalten. Ein reiner GitHub-Quellcode-ZIP-Export enthält diesen Git-Verweis nicht.
          +2. Im Fork alle Änderungen aus `Iceraven-Kiwi-Erweiterungen.patch` anwenden (siehe unten). Die ZIP mit allen Dateien kann ebenfalls als Quellvergleich dienen; ein neues leeres Repository nur aus ZIP-Dateien hat aber keinen Submodul-Gitlink.
          +3. Im eigenen Fork unter **Actions → Kiwi-style Iceraven APK (preview) → Run workflow** starten. Der Workflow ist vorbereitet, aber nicht in einer echten GitHub Actions-Ausführung überprüft.
          +4. Das erzeugte Debug-APK ggf. aus den Workflow-Artefakten herunterladen. Die Debug-Signatur eignet sich ausschließlich zu privaten Tests; für eine produktive Veröffentlichung ist ein eigener sicher verwahrter Release-Key nötig.
          +
          +Alternativ aus der Konsole (Linux, Android SDK und Java gemäß Original-README):
          +
          +```bash
          +git clone --recursive -b iceraven https://github.com/fork-maintainers/iceraven-browser.git
          +cd iceraven-browser
          +git apply --check ../Iceraven-Kiwi-Erweiterungen.patch
          +git apply ../Iceraven-Kiwi-Erweiterungen.patch
          +./automation/iceraven/install-sdk.sh
          +./automation/iceraven/patch_android_components.sh
          +./automation/iceraven/setup_venv.sh
          +./gradlew app:assembleForkDebug --stacktrace
          +```
          +
          +**Hinweis:** Auf GitHub sollte idealerweise der exakt gleiche Commit verwendet werden wie für den bereitgestellten ZIP-Export. Falls der Zweig seitdem weiterentwickelt wurde, kann der Patch Konflikte melden; dann muss er an den neuen Code angepasst werden.
          +
          +## Warum keine APK hier?
          +
          +Das Archiv hat über 4.000 Dateien, aber das referenzierte `android-components`-Git-Submodul ist im ZIP leer. Zudem fehlen in dieser Laufzeit Android SDK und Gradle 9.8.1; der Gradle-Download scheitert hier an fehlendem Netzwerkkontakt. Deshalb konnte die **Gesamt-App nicht kompiliert** werden.
          +
          +## Sicherheit und Rechte
          +
          +Dies ist kein abschließender Sicherheits-Audit. Das Original enthält eine Netzwerkfreigabe für HTTP-Sites (`usesCleartextTraffic` und `network_security_config.xml`), die bei einem Browser funktionale Gründe haben kann. Diese Konfiguration wurde ohne umfassende Prüfung nicht entfernt. Ebenso wurden Schutz-Flags im Privatmodus nicht angefasst. Vor ernsthaftem Einsatz sind aktuelle GeckoView-Sicherheitsupdates, Regressionstests und ein signierter Release erforderlich.
          +
          +Die ursprünglichen Lizenzhinweise bleiben erhalten. Der Großteil des Projekts unterliegt der Mozilla Public License 2.0 (MPL-2.0). Neue Kotlin-Dateien enthalten entsprechende Lizenzheader; Dritt-Abhängigkeiten können eigene Lizenzen haben.
