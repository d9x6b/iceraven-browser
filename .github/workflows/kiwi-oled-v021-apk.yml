          +package org.mozilla.fenix.settings
          +
          +import org.junit.Assert.assertEquals
          +import org.junit.Assert.assertNull
          +import org.junit.Test
          +
          +class KiwiDisplayControllerTest {
          +    @Test
          +    fun `orientation only accepts supported values`() {
          +        assertEquals("system", KiwiDisplayController.validOrientation(null))
          +        assertEquals("system", KiwiDisplayController.validOrientation("landscape; rm -rf"))
          +        assertEquals("portrait", KiwiDisplayController.validOrientation("portrait"))
          +        assertEquals("landscape", KiwiDisplayController.validOrientation("landscape"))
          +    }
          +
          +    @Test
          +    fun `brightness maps supported values to fractions`() {
          +        assertNull(KiwiDisplayController.brightnessFraction(null))
          +        assertNull(KiwiDisplayController.brightnessFraction("garbage"))
          +        assertEquals(0.25f, KiwiDisplayController.brightnessFraction("25")!!, 0f)
          +        assertEquals(0.5f, KiwiDisplayController.brightnessFraction("50")!!, 0f)
          +        assertEquals(0.75f, KiwiDisplayController.brightnessFraction("75")!!, 0f)
          +        assertEquals(1f, KiwiDisplayController.brightnessFraction("100")!!, 0f)
          +    }
          +}
