          new file mode 100644
          index 0000000..d528b75
          --- /dev/null
          +++ b/app/src/main/java/org/mozilla/fenix/settings/KiwiDisplayController.kt
          @@ -0,0 +1,118 @@
          +/* This Source Code Form is subject to the terms of the Mozilla Public
          + * License, v. 2.0. If a copy of the MPL was not distributed with this
          + * file, You can obtain one at http://mozilla.org/MPL/2.0/. */
          +
          +package org.mozilla.fenix.settings
          +
          +import android.app.Activity
          +import android.content.SharedPreferences
          +import android.content.pm.ActivityInfo
          +import android.view.WindowManager
          +
          +/**
          + * Optional display controls. Uses the app's existing `fenix_preferences` store.
          + * Owns only flags it enabled; restores the previous brightness when the app is paused.
          + * The default values leave the original browser behavior unchanged.
          + */
          +internal class KiwiDisplayController(
          +    private val activity: Activity,
          +    private val preferences: SharedPreferences,
          +) {
          +    private var awakeByKiwi = false
          +    private var priorBrightness: Float? = null
          +    private var priorOrientation: Int? = null
          +
          +    fun apply() {
          +        val keepAwake = preferences.getBoolean(KEEP_AWAKE_KEY, false)
          +        if (keepAwake && !awakeByKiwi) {
          +            activity.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
          +            awakeByKiwi = true
          +        } else if (!keepAwake && awakeByKiwi) {
          +            activity.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
          +            awakeByKiwi = false
          +        }
          +
          +        val orientation = when (validOrientation(preferences.getString(ORIENTATION_KEY, SYSTEM))) {
          +            PORTRAIT -> ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
          +            LANDSCAPE -> ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
          +            else -> null
          +        }
          +        if (orientation == null) {
          +            // Do not override onboarding / application orientation policy by default.
          +            priorOrientation?.let { activity.requestedOrientation = it }
          +            priorOrientation = null
          +        } else {
          +            if (priorOrientation == null) {
          +                priorOrientation = activity.requestedOrientation
          +            }
          +            if (activity.requestedOrientation != orientation) {
          +                activity.requestedOrientation = orientation
          +            }
          +        }
          +
          +        val value = validBrightness(preferences.getString(BRIGHTNESS_KEY, SYSTEM))
          +        val brightness = brightnessFraction(value)
          +        if (brightness == null) {
          +            restoreBrightness()
          +        } else {
          +            if (priorBrightness == null) {
          +                priorBrightness = activity.window.attributes.screenBrightness
          +            }
          +            activity.window.attributes = activity.window.attributes.apply {
          +                screenBrightness = brightness
          +            }
          +        }
          +    }
          +
          +    /** Releases only the temporary changes this controller owns. */
          +    fun release() {
          +        if (awakeByKiwi) {
          +            activity.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
          +            awakeByKiwi = false
          +        }
          +        restoreBrightness()
          +    }
          +
          +    private fun restoreBrightness() {
          +        priorBrightness?.let { previous ->
          +            activity.window.attributes = activity.window.attributes.apply {
          +                screenBrightness = previous
          +            }
          +        }
          +        priorBrightness = null
          +    }
          +
          +    companion object {
          +        const val KEEP_AWAKE_KEY = "kiwi_display_keep_awake"
          +        const val ORIENTATION_KEY = "kiwi_display_orientation"
          +        const val BRIGHTNESS_KEY = "kiwi_display_brightness"
          +        const val SYSTEM = "system"
          +        private const val PORTRAIT = "portrait"
          +        private const val LANDSCAPE = "landscape"
          +
          +        fun validOrientation(value: String?): String =
          +            when (value) {
          +                PORTRAIT -> PORTRAIT
          +                LANDSCAPE -> LANDSCAPE
          +                else -> SYSTEM
          +            }
          +
          +        fun validBrightness(value: String?): String =
          +            when (value) {
          +                "25" -> "25"
          +                "50" -> "50"
          +                "75" -> "75"
          +                "100" -> "100"
          +                else -> SYSTEM
          +            }
          +
          +        fun brightnessFraction(value: String?): Float? =
          +            when (validBrightness(value)) {
          +                "25" -> 0.25f
          +                "50" -> 0.5f
          +                "75" -> 0.75f
          +                "100" -> 1.0f
          +                else -> null
          +            }
          +    }
          +}
