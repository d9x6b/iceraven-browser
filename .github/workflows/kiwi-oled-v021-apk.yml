          +# Änderungen gegenüber hochgeladenem Iceraven-Archiv
          +
          +## Neue funktionale Einstellungen
          +
          +- Neue Kategorie im **Anpassen**-Bildschirm, nicht in `preferences.xml` (im älteren Toolkit war die Einfügestelle falsch).
          +- Persistente Werte im vorhandenen App-Store und sofortige Anwendung über `HomeActivity`.
          +- Bildschirm wach, Orientierung und Fensterhelligkeit; bei Standardwerten keine Änderung der App-Ausrichtung und der Helligkeit.
          +- Lebenszyklus-Freigabe für Bildschirm-Wachhalten und temporäre Helligkeit.
          +- Strings auf Deutsch und Englisch.
          +
          +## Vereinfachungen und Fehlerprävention
          +
          +- Keine Protokollierung der Inhalte von String-Präferenzen in `SharedPreferenceUpdater`.
          +- Keine unnötige Add-on-Cache-Leerung bei unverändertem Eintrag.
          +- Zwei redundante Konstruktionen von `Settings(requireContext())` entfernt.
          +
          +## Prüfungen und Buildvorbereitung
          +
          +- XML- und Resource-Audit, Kotlin-Controller-Smoketests mit Android-Stubs, JUnit-Tests (erst nach Gradle-Build ausführbar).
          +- Optionaler manueller GitHub-Actions-Workflow für eine Test-APK, **nicht ausgeführt**.
          +- Kein Chromium- oder GeckoView-Engine-Quellcode geändert. Keine Drittbibliotheken blind entfernt.
