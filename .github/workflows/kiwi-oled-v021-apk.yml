          @@ -0,0 +1,54 @@
          +package org.mozilla.fenix.settings
          +
          +import android.app.Activity
          +import android.content.SharedPreferences
          +import android.content.pm.ActivityInfo
          +import android.view.WindowManager
          +
          +class FakePrefs : SharedPreferences {
          +    val values = mutableMapOf<String, Any>()
          +    override fun getBoolean(key: String, defaultValue: Boolean) = values[key] as? Boolean ?: defaultValue
          +    override fun getString(key: String, defaultValue: String?) = values[key] as? String ?: defaultValue
          +}
          +
          +fun main() {
          +    val prefs = FakePrefs()
          +    val activity = Activity()
          +    activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT // onboarding owns this
          +    activity.window.attributes.screenBrightness = 0.83f
          +    val controller = KiwiDisplayController(activity, prefs)
          +
          +    controller.apply()
          +    check(activity.requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_PORTRAIT)
          +    check(activity.window.flags == 0)
          +    check(activity.window.attributes.screenBrightness == 0.83f)
          +
          +    prefs.values[KiwiDisplayController.KEEP_AWAKE_KEY] = true
          +    prefs.values[KiwiDisplayController.ORIENTATION_KEY] = "landscape"
          +    prefs.values[KiwiDisplayController.BRIGHTNESS_KEY] = "25"
          +    controller.apply()
          +    check(activity.window.flags and WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON != 0)
          +    check(activity.requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE)
          +    check(activity.window.attributes.screenBrightness == 0.25f)
          +
          +    prefs.values[KiwiDisplayController.ORIENTATION_KEY] = "system"
          +    prefs.values[KiwiDisplayController.BRIGHTNESS_KEY] = "system"
          +    prefs.values[KiwiDisplayController.KEEP_AWAKE_KEY] = false
          +    controller.apply()
          +    check(activity.requestedOrientation == ActivityInfo.SCREEN_ORIENTATION_PORTRAIT)
          +    check(activity.window.flags and WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON == 0)
          +    check(activity.window.attributes.screenBrightness == 0.83f)
          +
          +    prefs.values[KiwiDisplayController.KEEP_AWAKE_KEY] = true
          +    prefs.values[KiwiDisplayController.BRIGHTNESS_KEY] = "50"
          +    controller.apply()
          +    controller.release()
          +    check(activity.window.flags and WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON == 0)
          +    check(activity.window.attributes.screenBrightness == 0.83f)
          +
          +    check(KiwiDisplayController.validOrientation("bad") == "system")
          +    check(KiwiDisplayController.validBrightness("200") == "system")
          +    check(KiwiDisplayController.brightnessFraction("garbage") == null)
          +    check(KiwiDisplayController.brightnessFraction("100") == 1f)
          +    println("PASS: 15 Kotlin controller checks using Android test stubs (not an APK build)")
          +}
